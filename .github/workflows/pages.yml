name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".nojekyll"
      - "404.html"
      - "index.html"
      - "assets/**"
      - "cv/**"
      - "insights/**"
      - "publications/**"
      - "research/**"
      - "robots.txt"
      - "search/**"
      - "sitemap.xml"
      - "sitemap.xml.gz"
      - "teaching/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Copy built site to repository root
        run: |
          rm -rf 404.html index.html assets cv insights publications research robots.txt search sitemap.xml sitemap.xml.gz teaching
          cp -R site/. .
          touch .nojekyll

      - name: Commit built site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 404.html index.html assets cv insights publications research robots.txt search sitemap.xml sitemap.xml.gz teaching .nojekyll
          if git diff --cached --quiet; then
            echo "Built site files are already up to date."
          else
            git commit -m "Build MkDocs site [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
