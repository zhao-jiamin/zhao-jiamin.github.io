site_name: Jiamin Zhao
site_description: Jiamin Zhao is a Ph.D. student in Accounting at IESE Business School researching corporate disclosure, stakeholder pressure, public activism, textual analysis, capital markets, labor markets, and sustainability.
site_url: https://zhao-jiamin.github.io/
repo_url: https://github.com/zhao-jiamin/zhao-jiamin.github.io
repo_name: zhao-jiamin/zhao-jiamin.github.io
copyright: Copyright &copy; 2026 Jiamin Zhao

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/iese-logo.png
  favicon: assets/images/monogram.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: white
    accent: teal
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zhao-jiamin
      name: GitHub

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - About: index.md
  - Research: research.md
  - Publications: publications.md
  - Teaching: teaching.md
  - Insights: insights.md
  - CV: cv.md
