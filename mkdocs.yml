site_name: Jiamin Zhao
site_description: Jiamin Zhao is a Ph.D. Candidate in Accounting at IESE Business School studying how stakeholders and emerging technologies shape corporate disclosure and information access.
site_url: https://zhao-jiamin.github.io/
copyright: Copyright &copy; 2026 Jiamin Zhao

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/iese-logo.png
  favicon: assets/images/monogram.svg
  palette:
    scheme: default
    primary: white
    accent: red
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - assets/stylesheets/extra.css

plugins: []

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Research: research.md
  - Publications: publications.md
  - Teaching: teaching.md
  - Media: insights.md
  - CV: cv.md
